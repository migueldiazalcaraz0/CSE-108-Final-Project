<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Messages - Fake Twitter</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      display: flex;
      width: 1200px;
    }
    .sidebar {
      width: 250px;
      padding: 20px;
      border-right: 1px solid #333;
      height: 100vh;
    }
    .sidebar .nav-link {
      display: flex;
      align-items: center;
      font-size: 18px;
      padding: 12px 0;
      cursor: pointer;
    }
    .sidebar i {
      margin-right: 10px;
    }
    .main {
      flex: 1;
      padding: 20px;
    }
    .message-card {
      background-color: #111;
      border-radius: 10px;
      padding: 15px;
      margin-bottom: 15px;
      transition: background 0.2s;
    }
    .message-card:hover {
      background-color: #222;
    }
    .message-card .from {
      font-weight: bold;
    }
    .message-card .preview {
      color: #aaa;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <i class="fab fa-twitter fa-2x" style="color: #1DA1F2;"></i>
      <div class="nav-link" onclick="location.href='home.html'"><i class="fas fa-home"></i> Home</div>
      <div class="nav-link" onclick="location.href='explore.html'"><i class="fas fa-hashtag"></i> Explore</div>
      <div class="nav-link" onclick="location.href='notifications.html'"><i class="far fa-bell"></i> Notifications</div>
      <div class="nav-link" onclick="location.href='messages.html'"><i class="far fa-envelope"></i> Messages</div>
      <div class="nav-link" onclick="location.href='profile.html'"><i class="far fa-user"></i> Profile</div>
      <div class="nav-link" onclick="location.href='more.html'"><i class="fas fa-ellipsis-h"></i> More</div>
      <div class="nav-link" onclick="location.href='index.html'"><i class="fas fa-sign-out-alt"></i> Log out</div>
    </div>

    <div class="main">
      <h2>Messages</h2>
      <div class="message-card">
        <div class="from">@510mathew</div>
        <div class="preview">Yo you seen the lineup for Dreamville?</div>
      </div>
      <div class="message-card">
        <div class="from">@blxst</div>
        <div class="preview">We should link up at UC Merced again.</div>
      </div>
      <div class="message-card">
        <div class="from">@bino</div>
        <div class="preview">🔥 that last tweet was facts lol</div>
      </div>
    </div>
  </div>
</body>
</html>
