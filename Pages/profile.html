<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile - Twitter Clone</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      justify-content: center;
    }
    .container {
      display: flex;
      width: 1200px;
    }
    .sidebar {
      width: 250px;
      padding: 20px;
      border-right: 1px solid #333;
      height: 100vh;
    }
    .sidebar i {
      margin-right: 10px;
    }
    .sidebar .nav-link {
      display: flex;
      align-items: center;
      font-size: 18px;
      padding: 12px 0;
      cursor: pointer;
    }
    .main-content {
      flex: 1;
      padding: 20px;
      border-right: 1px solid #333;
    }
    .profile-header {
      background-color: #111;
      padding: 20px;
      border-radius: 15px;
      margin-bottom: 20px;
    }
    .profile-avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background-color: #ccc;
      margin-bottom: 15px;
      background-image: url('https://abs.twimg.com/sticky/default_profile_images/default_profile_400x400.png');
      background-size: cover;
      background-position: center;
    }
    .profile-info h1 {
      margin: 0;
      font-size: 24px;
    }
    .profile-info .username {
      color: #888;
      font-size: 16px;
      margin-bottom: 10px;
    }
    .profile-stats {
      display: flex;
      gap: 20px;
      margin-top: 15px;
    }
    .stat {
      color: #888;
    }
    .stat strong {
      color: #fff;
    }
    .tweets-section {
      margin-top: 20px;
    }
    .tweet {
      background-color: #111;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <i class="fab fa-twitter fa-2x" style="color: #1DA1F2;"></i>
      <div class="nav-link" onclick="location.href='home.html'"><i class="fas fa-home"></i> Home</div>
      <div class="nav-link" onclick="location.href='explore.html'"><i class="fas fa-hashtag"></i> Explore</div>
      <div class="nav-link" onclick="location.href='notifications.html'"><i class="far fa-bell"></i> Notifications</div>
      <div class="nav-link" onclick="location.href='messages.html'"><i class="far fa-envelope"></i> Messages</div>
      <div class="nav-link" onclick="location.href='profile.html'"><i class="far fa-user"></i> Profile</div>
      <div class="nav-link" onclick="location.href='more.html'"><i class="fas fa-ellipsis-h"></i> More</div>
      <div class="nav-link" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Log out</div>
    </div>

    <div class="main-content">
      <div class="profile-header">
        <div class="profile-avatar"></div>
        <div class="profile-info">
          <h1 id="profileName"></h1>
          <div class="username" id="profileUsername"></div>
          <div class="profile-stats">
            <div class="stat"><strong>0</strong> Following</div>
            <div class="stat"><strong>0</strong> Followers</div>
          </div>
        </div>
      </div>

      <div class="tweets-section">
        <h2>Your Tweets</h2>
        <div id="userTweets"></div>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    function showUserProfile() {
      const user = checkAuth();
      if (user) {
        document.getElementById('profileName').textContent = user.name;
        document.getElementById('profileUsername').textContent = '@' + user.username;
      }
    }

    async function showUserTweets() {
      const user = checkAuth();
      if (!user) return;

      try {
        const response = await fetch(`http://localhost:5001/api/tweets/user/${user.id}`);
        const tweets = await response.json();
        
        const container = document.getElementById("userTweets");
        container.innerHTML = tweets.map(tweet => `
          <div class="tweet">
            <div class="tweet-content">
              <span class="name">${tweet.name}</span>
              <span class="username">@${tweet.username}</span>
              <div class="time">${new Date(tweet.createdAt).toLocaleString()}</div>
              <div>${tweet.text}</div>
            </div>
          </div>
        `).join("");
      } catch (error) {
        console.error('Error fetching user tweets:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      showUserProfile();
      showUserTweets();
    });
  </script>
</body>
</html>
