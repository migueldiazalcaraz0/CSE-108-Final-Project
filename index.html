<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in to Twitter</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 100vh;
      padding: 0 10%;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .logo i {
      font-size: 10rem;
      color: #1DA1F2;
    }

    .content {
      max-width: 400px;
      background-color: #111;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 0 20px #111;
    }

    .content h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
    }

    .content p {
      font-size: 1.2rem;
      margin-bottom: 2rem;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: none;
      border-radius: 999px;
      font-size: 1rem;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      border: none;
      margin-top: 10px;
    }

    .btn-google, .btn-apple {
      background-color: #fff;
      color: #000;
    }

    .btn-login {
      background-color: #1DA1F2;
      color: #fff;
    }

    .divider {
      text-align: center;
      margin: 1rem 0;
      color: #555;
    }

    .bottom-link {
      text-align: center;
      margin-top: 1rem;
    }

    a {
      color: #1DA1F2;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    @media screen and (max-width: 800px) {
      body {
        flex-direction: column;
        padding: 2rem;
      }

      .logo i {
        font-size: 6rem;
        margin-bottom: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="logo">
    <i class="fab fa-twitter"></i>
  </div>

  <div class="content">
    <h1>Happening now</h1>
    <p>Join today.</p>

    <button class="btn btn-google" onclick="fakeLogin('Google')">
      <i class="fab fa-google"></i> Sign up with Google
    </button>

    <button class="btn btn-apple" onclick="fakeLogin('Apple')">
      <i class="fab fa-apple"></i> Sign up with Apple
    </button>

    <div class="divider">OR</div>

    <input id="email" type="text" placeholder="Email">
    <input id="password" type="password" placeholder="Password">
    <button class="btn btn-login" onclick="fakeLogin('Email/Password')">Create account</button>

    <div class="bottom-link">
      Already have an account? <a href="#">Sign in</a>
    </div>
  </div>

  <script>
    function fakeLogin(method) {
      const email = document.getElementById("email")?.value;
      localStorage.setItem("loginMethod", method);
      if (email) {
        localStorage.setItem("username", email);
      }
      window.location.href = "home.html";
    }
  </script>
</body>
</html>
