<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Explore - Fake Twitter</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      background-color: #000;
      color: white;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
    }
    .container {
      display: flex;
      width: 1200px;
    }
    .sidebar {
      width: 250px;
      padding: 20px;
      border-right: 1px solid #333;
      height: 100vh;
    }
    .sidebar .nav-link {
      display: flex;
      align-items: center;
      font-size: 18px;
      padding: 12px 0;
      cursor: pointer;
    }
    .sidebar i {
      margin-right: 10px;
    }
    .main {
      flex: 1;
      padding: 20px;
    }
    .search-bar input {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 999px;
      border: none;
      outline: none;
      background-color: #222;
      color: white;
    }
    .trending {
      margin-top: 20px;
    }
    .trending h3 {
      margin-bottom: 10px;
    }
    .trend {
      padding: 12px;
      background: #111;
      border-radius: 10px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .trend:hover {
      background: #222;
    }
    .trend span {
      color: #888;
      font-size: 12px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <i class="fab fa-twitter fa-2x" style="color: #1DA1F2;"></i>
      <div class="nav-link" onclick="location.href='home.html'"><i class="fas fa-home"></i> Home</div>
      <div class="nav-link" onclick="location.href='explore.html'"><i class="fas fa-hashtag"></i> Explore</div>
      <div class="nav-link" onclick="location.href='notifications.html'"><i class="far fa-bell"></i> Notifications</div>
      <div class="nav-link" onclick="location.href='messages.html'"><i class="far fa-envelope"></i> Messages</div>
      <div class="nav-link" onclick="location.href='profile.html'"><i class="far fa-user"></i> Profile</div>
      <div class="nav-link" onclick="location.href='more.html'"><i class="fas fa-ellipsis-h"></i> More</div>
      <div class="nav-link" onclick="location.href='index.html'"><i class="fas fa-sign-out-alt"></i> Log out</div>
    </div>

    <div class="main">
      <div class="search-bar">
        <input type="text" placeholder="Search Twitter">
      </div>
      <div class="trending">
        <h3>Trends for you</h3>
        <div class="trend">
          <span>Trending in Music</span>
          #PlayboiCarti
        </div>
        <div class="trend">
          <span>Trending in NBA</span>
          #Lakers
        </div>
        <div class="trend">
          <span>Trending in Tech</span>
          #AI2025
        </div>
      </div>
    </div>
  </div>
</body>
</html>
